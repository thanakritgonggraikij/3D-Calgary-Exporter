<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walmart Topo-Exporter</title>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jscastro76/threebox@v.2.2.2/dist/threebox.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="map"></div>
    <aside class="controls">
        <h3>Walmart Topo-Exporter</h3>
        <div id="geocoder"></div>
        <button class="btn btn-primary" id="loadApiTrees">Load API Trees</button>
        <button class="btn btn-primary" id="loadDetailedBuildings">Load Detailed 3D Buildings</button>
        <button class="btn btn-secondary" id="exportGeoJSON" disabled>Export GeoJSON (API Data)</button>
        <button class="btn btn-secondary" id="exportOBJ">Export OBJ (Detailed 3D)</button>
        <button class="btn btn-secondary" id="exportExcel" disabled>Export Excel (API Metadata)</button>
        <div id="status" class="status"></div>
        <div class="info">
            <strong>Workflow:</strong><br>
            1. Search an address or pan to an area<br>
            2. Load API trees or detailed buildings<br>
            3. Export the data you need<br>
            <br>
            <strong>Data:</strong> City of Calgary Open Data
        </div>
    </aside>

    <!-- Vendor libraries -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jscastro76/threebox@v.2.2.2/dist/threebox.min.js"></script>

    <!-- Application modules: load in dependency order. -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/map.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/trees.js"></script>
    <script src="js/exporters.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
