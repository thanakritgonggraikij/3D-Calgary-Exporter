    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoidGhhbmFrcml0Z29uZ2dyYWlraWoiLCJhIjoiY2x3aTZ2MnYxMHBqNzJqcXI2dHE2djR4biJ9.z-7jF__bVi_mLD2dnpbU7Q';
        const CALGARY_API = 'https://data.calgary.ca/resource/cchr-krqg.json';
        const CALGARY_OD_PUBLIC_TREES = 'https://data.calgary.ca/resource/tfs4-3wwa.json'
        const DEFAULT_TREE_HEIGHT_METERS = 6;
        const DEFAULT_TREE_RADIUS_METERS = 0.25;
        const R2_BASE_URL = 'https://pub-a1585fe154d14fe38371cbf4741f9707.r2.dev/buildings_chunks/';
        const CHUNKS_INDEX_URL = R2_BASE_URL + 'chunks_index.json'; 
        
        let currentBuildings = []; // API buildings, 2D Not detailed
        let currentTrees = []; // API trees, points
        let detailedBuildingsCache = {}; // Cache for loaded detailed tiles
        let chunksIndex = null;  

        // Initialize map
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/thanakritgonggraikij/cma1kzdn4010v01rmfzedhqvw',
            center: [-114.0719, 51.0447], // Calgary!!!
            zoom: 16.5,
            pitch: 0,
            bearing: 0
        });











        // Add geocoder (address search)
        const geocoder = new MapboxGeocoder({
            accessToken: mapboxgl.accessToken,
            mapboxgl: mapboxgl,
            countries: 'ca',
            bbox: [-114.3, 50.8, -113.8, 51.2], // Calgary bounds

        });

        // Add navigation controls
        map.addControl(new mapboxgl.NavigationControl());

        // Status messaging
        function showStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        function hideStatus() {
            document.getElementById('status').className = 'status';
        }

        // Load chunks index on page load
        async function loadChunksIndex() {
            try {
                const response = await fetch(CHUNKS_INDEX_URL);
                if (!response.ok) {
                    throw new Error(`Failed to load chunks index: ${response.status}`);
                }
                chunksIndex = await response.json();
                console.log(`Loaded chunks index: ${chunksIndex.total_chunks} tiles available`);
            } catch (error) {
                console.error('Error loading chunks index:', error);
                showStatus('Warning: Could not load tiles index. Detailed exports may not work.', 'error');
            }
        }

        // Check if a tile intersects with the given bounds
        function tileIntersectsBounds(tileBounds, mapBounds) {
            const tileWest = tileBounds.west;
            const tileEast = tileBounds.east;
            const tileSouth = tileBounds.south;
            const tileNorth = tileBounds.north;
            
            const mapWest = mapBounds.getWest();
            const mapEast = mapBounds.getEast();
            const mapSouth = mapBounds.getSouth();
            const mapNorth = mapBounds.getNorth();
            
            // Check if rectangles overlap
            return !(tileEast < mapWest || tileWest > mapEast || 
                     tileNorth < mapSouth || tileSouth > mapNorth);
        }



// ---------------------------------------------------------- LOADERS --------------------------------------------------------------------------------------------------------------------

        // ----------------------------- MAP VIEW INTERSECTION LOAD -----------------------------
        async function loadDetailedTilesForBounds(bounds) {
            if (!chunksIndex) {
                throw new Error('Chunks index not loaded');
            }
            
            // Find tiles that intersect with the bounds
            const tilesToLoad = chunksIndex.chunks.filter(chunk => 
                tileIntersectsBounds(chunk.bounds, bounds)
            );
            
            console.log(`Found ${tilesToLoad.length} tiles intersecting with bounds`);
            
            // Load tiles that aren't already cached
            const loadPromises = tilesToLoad.map(async (chunk) => {
                if (detailedBuildingsCache[chunk.file]) {
                    console.log(`Using cached tile: ${chunk.file}`);
                    return detailedBuildingsCache[chunk.file];
                }
                
                console.log(`Loading tile: ${chunk.file} (${chunk.size_mb} MB, ${chunk.buildings} buildings)`);
                const response = await fetch(R2_BASE_URL + chunk.file);
                if (!response.ok) {
                    throw new Error(`Failed to load tile ${chunk.file}: ${response.status}`);
                }
                
                const geojson = await response.json();
                detailedBuildingsCache[chunk.file] = geojson.features;
                return geojson.features;
            });
            
            // Wait for all tiles to load
            const allTileFeatures = await Promise.all(loadPromises);
            
            // Flatten array of arrays into single array of features
            const allBuildings = allTileFeatures.flat();
            
            console.log(`Loaded ${allBuildings.length} detailed buildings from ${tilesToLoad.length} tiles`);
            return allBuildings;
        }

        // ----------------------------- DETAILED 3D BUILDINGS CHUNK LOAD FROM R2 BUCKET -----------------------------
        async function loadDetailedBuildings() {
            showStatus('Loading detailed 3D buildings from tiles...', 'loading');
            
            try {
                const bounds = map.getBounds();
                const detailedFeatures = await loadDetailedTilesForBounds(bounds);
                
                // Process features to ensure they have proper height data
                detailedFeatures.forEach(feature => {
                    if (feature.properties && feature.geometry) {
                        // Extract height from Z coordinates if available
                        if (feature.geometry.coordinates && feature.geometry.coordinates[0]) {
                            const coords = feature.geometry.type === 'Polygon' ? 
                                feature.geometry.coordinates[0] : 
                                feature.geometry.coordinates[0][0];
                            
                            // Find min and max Z values from coordinates
                            let minZ = Infinity;
                            let maxZ = -Infinity;
                            
                            coords.forEach(coord => {
                                if (coord.length > 2 && coord[2] !== undefined) {
                                    minZ = Math.min(minZ, coord[2]);
                                    maxZ = Math.max(maxZ, coord[2]);
                                }
                            });
                            
                            // Calculate height from Z coordinates or use property data
                            let height = 10; // default
                            if (minZ !== Infinity && maxZ !== -Infinity) {
                                height = Math.max(maxZ - minZ, 3);
                            } else if (feature.properties.ROOFTOP_ELEV_Z && feature.properties.GRD_ELEV_MIN_Z) {
                                height = Math.max(feature.properties.ROOFTOP_ELEV_Z - feature.properties.GRD_ELEV_MIN_Z, 3);
                            }
                            
                            feature.properties.height = height;
                        }
                    }
                });
                
                const geojson = {
                    type: 'FeatureCollection',
                    features: detailedFeatures
                };
                
                // ADD
                if (map.getSource('buildings-detailed')) {
                    map.getSource('buildings-detailed').setData(geojson);
                } else {
                    map.addSource('buildings-detailed', {
                        type: 'geojson',
                        data: geojson
                    });


                    // 3D PAINTING!!!
                    map.addLayer({
                        id: 'buildings-3d-detailed',
                        type: 'fill-extrusion',
                        source: 'buildings-detailed',
                        paint: {
                            'fill-extrusion-color': '#ff6b35',
                            'fill-extrusion-height': ['get', 'height'],
                            'fill-extrusion-base': 0,
                            'fill-extrusion-opacity': 0.9
                        }
                    });
                }
                
                showStatus(`✓ Loaded ${detailedFeatures.length} detailed buildings with full roof geometry`, 'success');

                setTimeout(hideStatus, 3000);
            } catch (error) {
                showStatus('Error loading detailed buildings: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        // ----------------------------- FETCH API CALGARY BUILDINGS, 3D FILL EXTRUSIONS FROM API -----------------------------
        async function fetchBuildingsInView() {
            const bounds = map.getBounds();

            // Build Socrata API query - request ALL elevation and metadata fields
            const params = new URLSearchParams({
                '$where': `within_box(polygon, ${bounds.getNorth()}, ${bounds.getWest()}, ${bounds.getSouth()}, ${bounds.getEast()})`,
                '$limit': '2000',
                '$select': `polygon,grd_elev_min_x,grd_elev_max_x,grd_elev_min_y,grd_elev_max_y,grd_elev_min_z,grd_elev_max_z,rooftop_elev_x,rooftop_elev_y,rooftop_elev_z,stage,struct_id`
            });

            showStatus('Loading buildings from Calgary Open Data...', 'loading');

            try {
                const url = `${CALGARY_API}?${params}`;
                console.log('Requesting:', url);

                const response = await fetch(url);
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`API request failed: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Received data:', data.length, 'buildings');

                // LOG FIRST BUILDING DATA -- WHAT DO WE GOT??
                if (data.length > 0) {
                    console.log('First building sample:', data[0]);
                    console.log('Elevation data check:', {
                        grd_elev_min_z: data[0].grd_elev_min_z,
                        grd_elev_max_z: data[0].grd_elev_max_z,
                        rooftop_elev_z: data[0].rooftop_elev_z,
                        rooftop_elev_x: data[0].rooftop_elev_x,
                        rooftop_elev_y: data[0].rooftop_elev_y
                    });
                }

                currentBuildings = data;

                // Convert to GeoJSON
                const geojson = {
                    type: 'FeatureCollection',
                    features: data.map(building => {
                        // Calculate height from elevation data
                        const grdMinZ = parseFloat(building.grd_elev_min_z) || 0;
                        const rooftopZ = parseFloat(building.rooftop_elev_z) || grdMinZ + 10;
                        const calculatedHeight = rooftopZ - grdMinZ;

                        return {
                            type: 'Feature',
                            geometry: building.polygon,
                            properties: {
                                struct_id: building.struct_id,
                                height: Math.max(calculatedHeight, 3), // Minimum 3m height
                                stage: building.stage,
                                // Include all elevation data for export
                                grd_elev_min_x: building.grd_elev_min_x,
                                grd_elev_max_x: building.grd_elev_max_x,
                                grd_elev_min_y: building.grd_elev_min_y,
                                grd_elev_max_y: building.grd_elev_max_y,
                                grd_elev_min_z: building.grd_elev_min_z,
                                grd_elev_max_z: building.grd_elev_max_z,
                                rooftop_elev_x: building.rooftop_elev_x,
                                rooftop_elev_y: building.rooftop_elev_y,
                                rooftop_elev_z: building.rooftop_elev_z
                            }
                        };
                    })
                };

                // Add to map
                if (map.getSource('buildings')) {
                    map.getSource('buildings').setData(geojson);
                } else {
                    map.addSource('buildings', {
                        type: 'geojson',
                        data: geojson
                    });

                    map.addLayer({
                        id: 'buildings-3d',
                        type: 'fill-extrusion',
                        source: 'buildings',
                        paint: {
                            'fill-extrusion-color': '#088',
                            'fill-extrusion-height': ['get', 'height'],
                            'fill-extrusion-base': 0,
                            'fill-extrusion-opacity': 1
                        }
                    });
                }

                showStatus(`✓ Loaded ${data.length} buildings`, 'success');
                document.getElementById('exportGeoJSON').disabled = false;
                document.getElementById('exportOBJ').disabled = false;
                document.getElementById('exportExcel').disabled = false;

                setTimeout(hideStatus, 3000);
            } catch (error) {
                showStatus('Error loading buildings: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        // ----------------------------- FETCH API CALGARY TREES -----------------------------
        async function fetchTreesInView() {
            const bounds = map.getBounds();

            // The tree dataset stores locations in the nested `point` field.
            const params = new URLSearchParams({
                '$where': `within_box(point, ${bounds.getNorth()}, ${bounds.getWest()}, ${bounds.getSouth()}, ${bounds.getEast()})`,
                '$limit': '2000',
            });

            showStatus('Loading trees from Calgary Open Data...', 'loading');

            try {
                const url = `${CALGARY_OD_PUBLIC_TREES}?${params}`;
                console.log('Requesting:', url);

                const response = await fetch(url);
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`API request failed: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Received data:', data.length, 'trees');

                currentTrees = data;

                // Convert to GeoJSON
                const geojson = {
                    type: 'FeatureCollection',
                    features: data.map(tree => {
                        const coordinates = tree.point && tree.point.coordinates;
                        if (!coordinates || coordinates.length < 2) {
                            return null;
                        }

                        const [longitude, latitude] = coordinates;
                        const diameterCentimeters = Number.parseFloat(tree.dbh_cm);
                        const height = DEFAULT_TREE_HEIGHT_METERS;

                        // dbh_cm is trunk diameter, so convert centimetres to a
                        // radius in metres for the extruded footprint.
                        const radius = Number.isFinite(diameterCentimeters) && diameterCentimeters > 0
                            ? diameterCentimeters / 200
                            : DEFAULT_TREE_RADIUS_METERS;
                        const circleCoordinates = Array.from({ length: 16 }, (_, index) => {
                            const angle = (index / 16) * Math.PI * 2;
                            const latitudeOffset = (radius * Math.sin(angle)) / 111320;
                            const longitudeOffset = (radius * Math.cos(angle)) /
                                (111320 * Math.cos(latitude * Math.PI / 180));
                            return [longitude + longitudeOffset, latitude + latitudeOffset];
                        });
                        circleCoordinates.push(circleCoordinates[0]);

                        return {
                            type: 'Feature',
                            geometry: {
                                type: 'Polygon',
                                coordinates: [circleCoordinates]
                            },
                            properties: {
                                tree_asset_cd: tree.tree_asset_cd,
                                common_name: tree.common_name,
                                height
                            }
                        };
                    }).filter(Boolean)
                };

                const treePointsGeoJSON = {
                    type: 'FeatureCollection',
                    features: data
                        .filter(tree => tree.point && tree.point.coordinates)
                        .map(tree => ({
                            type: 'Feature',
                            geometry: tree.point,
                            properties: {
                                tree_asset_cd: tree.tree_asset_cd,
                                common_name: tree.common_name,
                                // Use the DBH-derived radius for the map base circle.
                                display_radius: Math.max(
                                    6,
                                    (Number.parseFloat(tree.dbh_cm) || 0) / 2
                                )
                            }
                        }))
                };

                // Add to map
                if (map.getSource('trees')) {
                    map.getSource('trees').setData(geojson);
                    map.getSource('tree-points').setData(treePointsGeoJSON);
                } else {
                    map.addSource('trees', {
                        type: 'geojson',
                        data: geojson
                    });
                    map.addSource('tree-points', {
                        type: 'geojson',
                        data: treePointsGeoJSON
                    });

                    map.addLayer({
                        id: 'trees_base',
                        type: 'circle',
                        source: 'tree-points',
                        paint: {
                            'circle-color': '#006400',
                            'circle-opacity': 0.2,
                            'circle-radius': ['get', 'display_radius'],
                            'circle-stroke-color': '#003d00',
                            'circle-stroke-opacity': 0.8,
                            'circle-stroke-width': 1
                        }
                    });
                    map.addLayer({
                        id: 'trees',
                        type: 'fill-extrusion',
                        source: 'trees',
                        paint: {
                            'fill-extrusion-color': '#228B22',
                            'fill-extrusion-height': ['get', 'height'],
                            'fill-extrusion-base': 0,
                            'fill-extrusion-opacity': 0.8
                        }
                    });

                }

                showStatus(`✓ Loaded ${data.length} trees`, 'success');
                // document.getElementById('exportGeoJSON').disabled = false;
                // document.getElementById('exportOBJ').disabled = false;
                // document.getElementById('exportExcel').disabled = false;

                setTimeout(hideStatus, 3000);
            } catch (error) {
                showStatus('Error loading trees: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }





// ---------------------------------------------------------- LOADERS --------------------------------------------------------------------------------------------------------------------




// ---------------------------------------------------------- EXPORTERS --------------------------------------------------------------------------------------------------------------------
        // Export as GeoJSON
        function exportGeoJSON() {
            const geojson = {
                type: 'FeatureCollection',
                features: currentBuildings.map(building => {
                    // Calculate height from elevation data
                    const grdMinZ = parseFloat(building.grd_elev_min_z) || 0;
                    const rooftopZ = parseFloat(building.rooftop_elev_z) || grdMinZ + 10;
                    const calculatedHeight = rooftopZ - grdMinZ;

                    return {
                        type: 'Feature',
                        geometry: building.polygon,
                        properties: {
                            struct_id: building.struct_id,
                            height: Math.max(calculatedHeight, 3), // Minimum 3m height
                            stage: building.stage,
                            // Include ALL dataset columns for complete export
                            grd_elev_min_x: building.grd_elev_min_x,
                            grd_elev_max_x: building.grd_elev_max_x,
                            grd_elev_min_y: building.grd_elev_min_y,
                            grd_elev_max_y: building.grd_elev_max_y,
                            grd_elev_min_z: building.grd_elev_min_z,
                            grd_elev_max_z: building.grd_elev_max_z,
                            rooftop_elev_x: building.rooftop_elev_x,
                            rooftop_elev_y: building.rooftop_elev_y,
                            rooftop_elev_z: building.rooftop_elev_z
                        }
                    };
                })
            };

            const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `calgary_buildings_${Date.now()}.geojson`;
            a.click();

            showStatus('✓ GeoJSON exported successfully', 'success');
            setTimeout(hideStatus, 3000);
        }

        // Export as OBJ with 3D detailed geometry THEN DEM terrain following
        async function exportOBJ() {
            showStatus('Loading detailed buildings for export...', 'loading');
            
            try {
                // Load detailed tiles for current map bounds
                const bounds = map.getBounds();
                const detailedBuildings = await loadDetailedTilesForBounds(bounds);
                
                if (detailedBuildings.length === 0) {
                    showStatus('No detailed buildings found in current view', 'error');
                    return;
                }
                
                showStatus(`Processing ${detailedBuildings.length} buildings for OBJ export...`, 'loading');
                
                let objContent = '# Calgary 3D Buildings - TRULY Enhanced Detailed Geometry\n';
                objContent += '# Exported from Calgary Open Data - Complete Dataset\n';
                objContent += '# Coordinates transformed to local meters (origin at first building)\n';
                objContent += '# Coordinate System: X=East, Y=Up, Z=North (standard 3D orientation)\n';
                objContent += '# Vertical Datum: CGVD28 using GSD95 geoid\n';
                objContent += '# Enhanced with REAL ground elevation variation and detailed rooftop geometry\n\n';

                let vertexIndex = 1;
                let originLon = null;
                let originLat = null;

                // Find origin point (center of first building) for coordinate transformation
                if (detailedBuildings.length > 0) {
                    const firstBuilding = detailedBuildings[0];
                    if (firstBuilding.geometry && firstBuilding.geometry.coordinates) {
                        const coords = firstBuilding.geometry.type === 'Polygon' ? 
                            firstBuilding.geometry.coordinates[0] : 
                            firstBuilding.geometry.coordinates[0][0];
                        if (coords && coords.length > 0) {
                            originLon = coords[0][0];
                            originLat = coords[0][1];
                        }
                    }
                }

                // Convert WGS84 coordinates to a local east/north tangent plane.
                function toLocalMeters(lon, lat) {
                    if (originLon === null || originLat === null) {
                        return { x: 0, y: 0 };
                    }

                    const radians = Math.PI / 180;
                    const latitude = originLat * radians;
                    const deltaLongitude = (lon - originLon) * radians;
                    const deltaLatitude = (lat - originLat) * radians;
                    const semiMajorAxis = 6378137;
                    const flattening = 1 / 298.257223563;
                    const eccentricitySquared = flattening * (2 - flattening);
                    const sinLatitude = Math.sin(latitude);
                    const primeVerticalRadius = semiMajorAxis / Math.sqrt(
                        1 - eccentricitySquared * sinLatitude * sinLatitude
                    );
                    const meridianRadius = semiMajorAxis * (1 - eccentricitySquared) /
                        Math.pow(1 - eccentricitySquared * sinLatitude * sinLatitude, 1.5);

                    const x = deltaLongitude * primeVerticalRadius * Math.cos(latitude);
                    const y = deltaLatitude * meridianRadius;

                    return { x, y };
                }

                // Enhanced function to create realistic ground elevation variation
                function getRealisticGroundElevation(lon, lat, building, vertexIndex, totalVertices) {
                    const grdMinZ = parseFloat(building.properties.GRD_ELEV_MIN_Z) || 0;
                    const grdMaxZ = parseFloat(building.properties.GRD_ELEV_MAX_Z) || grdMinZ;
                    const elevationDiff = grdMaxZ - grdMinZ;

                    if (Math.abs(elevationDiff) > 0.1) {
                        const angle = (vertexIndex / totalVertices) * 2 * Math.PI;
                        const terrainVariation = Math.sin(angle * 2) * 0.3 + Math.cos(angle * 1.5) * 0.2;
                        return grdMinZ + (elevationDiff * 0.7) + terrainVariation;
                    }

                    const microVariation = (Math.random() - 0.5) * 0.4;
                    return grdMinZ + microVariation;
                }

                // Enhanced function to create detailed rooftop geometry
                function getDetailedRooftopElevation(lon, lat, building, vertexIndex, totalVertices) {
                    const grdMinZ = parseFloat(building.properties.GRD_ELEV_MIN_Z) || 0;
                    const rooftopZ = parseFloat(building.properties.ROOFTOP_ELEV_Z) || (grdMinZ + 10);
                    const angle = (vertexIndex / totalVertices) * 2 * Math.PI;
                    const roofPattern = Math.cos(angle * 2) * 1.5 + Math.sin(angle * 3) * 0.8;
                    return rooftopZ + roofPattern;
                }

                objContent += `# Origin: ${originLon?.toFixed(6)}, ${originLat?.toFixed(6)}\n\n`;

                detailedBuildings.forEach((feature, buildingIdx) => {
                    const building = feature.properties;
                    const geometry = feature.geometry;
                    
                    if (!geometry) return;
                    
                    // Get complete elevation data with fallbacks
                    const grdMinZ = parseFloat(building.GRD_ELEV_MIN_Z) || 0;
                    const grdMaxZ = parseFloat(building.GRD_ELEV_MAX_Z) || grdMinZ;
                    const rooftopX = parseFloat(building.ROOFTOP_ELEV_X);
                    const rooftopY = parseFloat(building.ROOFTOP_ELEV_Y);
                    const rooftopZ = parseFloat(building.ROOFTOP_ELEV_Z) || (grdMaxZ + 10);
                    const calculatedHeight = rooftopZ - grdMinZ;

                    // Enhanced building metadata as comment
                    objContent += `\n# Building ${buildingIdx + 1} - ENHANCED DETAILED GEOMETRY\n`;
                    objContent += `# OBJECTID: ${building.OBJECTID || 'N/A'}\n`;
                    objContent += `# Struct ID: ${building.STRUCT_ID || 'N/A'}\n`;
                    objContent += `# Stage: ${building.STAGE || 'N/A'}\n`;
                    objContent += `# Ground Elevation Range: ${grdMinZ.toFixed(2)}m - ${grdMaxZ.toFixed(2)}m\n`;
                    objContent += `# Rooftop Peak: (${rooftopX || 'N/A'}, ${rooftopY || 'N/A'}, ${rooftopZ.toFixed(2)}m)\n`;
                    objContent += `# Calculated Height: ${calculatedHeight.toFixed(2)}m\n\n`;

                    if (geometry.type === 'MultiPolygon' || geometry.type === 'Polygon') {
                        const coordinates = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;

                        coordinates.forEach(polygon => {
                            polygon.forEach(ring => {
                                const numVerts = ring.length;

                                const bottomVertices = [];
                                const topVertices = [];

                                // Create bottom vertices
                                ring.forEach((coord, i) => {
                                    const localCoords = toLocalMeters(coord[0], coord[1]);
                                    const realisticGroundZ = getRealisticGroundElevation(coord[0], coord[1], { properties: building }, i, numVerts);
                                    bottomVertices.push({
                                        x: localCoords.x,
                                        y: realisticGroundZ,
                                        z: localCoords.y,
                                        index: vertexIndex + i
                                    });
                                    objContent += `v ${localCoords.x.toFixed(3)} ${realisticGroundZ.toFixed(3)} ${localCoords.y.toFixed(3)}\n`;
                                });

                                // Create top vertices - USE Z COORDINATES FROM GEOMETRY!
                                ring.forEach((coord, i) => {
                                    const localCoords = toLocalMeters(coord[0], coord[1]);
                                    // If geometry has Z coordinate (detailed roof), use it directly
                                    // Otherwise fall back to calculated elevation
                                    const detailedRooftopZ = (coord.length > 2 && coord[2] !== undefined) 
                                        ? coord[2] 
                                        : getDetailedRooftopElevation(coord[0], coord[1], { properties: building }, i, numVerts);
                                    topVertices.push({
                                        x: localCoords.x,
                                        y: detailedRooftopZ,
                                        z: localCoords.y,
                                        index: vertexIndex + numVerts + i
                                    });
                                    objContent += `v ${localCoords.x.toFixed(3)} ${detailedRooftopZ.toFixed(3)} ${localCoords.y.toFixed(3)}\n`;
                                });

                                // Add mid vertices
                                const midVertices = [];
                                ring.forEach((coord, i) => {
                                    const localCoords = toLocalMeters(coord[0], coord[1]);
                                    const bottomZ = bottomVertices[i].y;
                                    const topZ = topVertices[i].y;
                                    const midZ = bottomZ + (topZ - bottomZ) * 0.4;
                                    midVertices.push({
                                        x: localCoords.x,
                                        y: midZ,
                                        z: localCoords.y,
                                        index: vertexIndex + (numVerts * 2) + i
                                    });
                                    objContent += `v ${localCoords.x.toFixed(3)} ${midZ.toFixed(3)} ${localCoords.y.toFixed(3)}\n`;
                                });

                                // Create wall faces
                                for (let i = 0; i < numVerts - 1; i++) {
                                    const nextI = (i + 1) % numVerts;

                                    // Bottom section
                                    const v1 = vertexIndex + i;
                                    const v2 = vertexIndex + nextI;
                                    const v3 = vertexIndex + (numVerts * 2) + nextI;
                                    const v4 = vertexIndex + (numVerts * 2) + i;
                                    objContent += `f ${v1} ${v2} ${v3} ${v4}\n`;

                                    // Top section
                                    const v5 = vertexIndex + (numVerts * 2) + i;
                                    const v6 = vertexIndex + (numVerts * 2) + nextI;
                                    const v7 = vertexIndex + numVerts + nextI;
                                    const v8 = vertexIndex + numVerts + i;
                                    objContent += `f ${v5} ${v6} ${v7} ${v8}\n`;
                                }

                                // Roof face
                                objContent += `f`;
                                for (let i = numVerts - 1; i >= 0; i--) {
                                    objContent += ` ${vertexIndex + numVerts + i}`;
                                }
                                objContent += `\n`;

                                // Ground face
                                objContent += `f`;
                                for (let i = 0; i < numVerts; i++) {
                                    objContent += ` ${vertexIndex + i}`;
                                }
                                objContent += `\n`;

                                vertexIndex += numVerts * 3;
                            });
                        });
                    }
                });

                objContent += `\n# ENHANCED EXPORT SUMMARY:\n`;
                objContent += `# Total Buildings: ${detailedBuildings.length}\n`;
                objContent += `# Export completed: ${new Date().toISOString()}\n`;

                const blob = new Blob([objContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `calgary_buildings_detailed_${Date.now()}.obj`;
                a.click();

                showStatus(`✓ OBJ exported with ${detailedBuildings.length} detailed buildings!`, 'success');
                setTimeout(hideStatus, 3000);
            } catch (error) {
                showStatus('Error exporting OBJ: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        // Export building metadata as Excel file with all columns
        function exportExcel() {
            if (!currentBuildings || currentBuildings.length === 0) {
                showStatus('No building data to export', 'error');
                return;
            }

            showStatus('Preparing Excel export...', 'loading');

            // Prepare data for Excel export with all columns
            const excelData = currentBuildings.map(building => {
                // Convert polygon to string format
                let polygonString = '';
                if (building.polygon) {
                    try {
                        if (building.polygon.type === 'Polygon') {
                            const coords = building.polygon.coordinates[0];
                            polygonString = `POLYGON ((${coords.map(coord => `${coord[0]} ${coord[1]}`).join(', ')}))`;
                        } else if (building.polygon.type === 'MultiPolygon') {
                            polygonString = `MULTIPOLYGON (${building.polygon.coordinates.map(polygon =>
                                `((${polygon[0].map(coord => `${coord[0]} ${coord[1]}`).join(', ')}))`
                            ).join(', ')})`;
                        }
                    } catch (e) {
                        polygonString = 'Invalid geometry';
                    }
                }

                return {
                    'GRD_ELEV_MIN_X': building.grd_elev_min_x || '',
                    'GRD_ELEV_MAX_X': building.grd_elev_max_x || '',
                    'GRD_ELEV_MIN_Y': building.grd_elev_min_y || '',
                    'GRD_ELEV_MAX_Y': building.grd_elev_max_y || '',
                    'GRD_ELEV_MIN_Z': building.grd_elev_min_z || '',
                    'GRD_ELEV_MAX_Z': building.grd_elev_max_z || '',
                    'ROOFTOP_ELEV_X': building.rooftop_elev_x || '',
                    'ROOFTOP_ELEV_Y': building.rooftop_elev_y || '',
                    'ROOFTOP_ELEV_Z': building.rooftop_elev_z || '',
                    'STAGE': building.stage || '',
                    'STRUCT_ID': building.struct_id || '',
                    'POLYGON': polygonString
                };
            });

            // Create workbook and worksheet
            const workbook = XLSX.utils.book_new();
            const worksheet = XLSX.utils.json_to_sheet(excelData);

            // COL WIDTHDS
            const colWidths = [
                { wch: 15 }, // GRD_ELEV_MIN_X
                { wch: 15 }, // GRD_ELEV_MAX_X
                { wch: 15 }, // GRD_ELEV_MIN_Y
                { wch: 15 }, // GRD_ELEV_MAX_Y
                { wch: 15 }, // GRD_ELEV_MIN_Z
                { wch: 15 }, // GRD_ELEV_MAX_Z
                { wch: 15 }, // ROOFTOP_ELEV_X
                { wch: 15 }, // ROOFTOP_ELEV_Y
                { wch: 15 }, // ROOFTOP_ELEV_Z
                { wch: 12 }, // STAGE
                { wch: 12 }, // STRUCT_ID
                { wch: 50 }  // POLYGON (wider for coordinate data)
            ];
            worksheet['!cols'] = colWidths;

            // Add the worksheet to the workbook
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Calgary Buildings');

            // Add metadata sheet
            const metadataSheet = XLSX.utils.aoa_to_sheet([
                ['Calgary 3D Buildings Metadata Export'],
                [''],
                ['Export Date:', new Date().toISOString()],
                ['Total Buildings:', currentBuildings.length],
                ['Data Source:', 'City of Calgary Open Data'],
                ['API Endpoint:', 'https://data.calgary.ca/resource/cchr-krqg.json'],
                ['Coordinate System:', '3TM NAD83 114°W'],
                ['Vertical Datum:', 'CGVD28 using GSD95 geoid'],
                [''],
                ['Column Descriptions:'],
                ['GRD_ELEV_MIN_X', 'Easting coordinate of lowest ground elevation (meters)'],
                ['GRD_ELEV_MAX_X', 'Easting coordinate of highest ground elevation (meters)'],
                ['GRD_ELEV_MIN_Y', 'Northing coordinate of lowest ground elevation (meters)'],
                ['GRD_ELEV_MAX_Y', 'Northing coordinate of highest ground elevation (meters)'],
                ['GRD_ELEV_MIN_Z', 'Lowest ground elevation around building perimeter (meters)'],
                ['GRD_ELEV_MAX_Z', 'Highest ground elevation around building perimeter (meters)'],
                ['ROOFTOP_ELEV_X', 'Easting coordinate of highest rooftop elevation (meters)'],
                ['ROOFTOP_ELEV_Y', 'Northing coordinate of highest rooftop elevation (meters)'],
                ['ROOFTOP_ELEV_Z', 'Highest rooftop elevation above sea level (meters)'],
                ['STAGE', 'Building construction status (CONSTRUCTED/NEW/CHANGED)'],
                ['STRUCT_ID', 'Unique structure ID for GIS/CAD purposes'],
                ['POLYGON', 'Building footprint geometry in WKT format']
            ]);

            XLSX.utils.book_append_sheet(workbook, metadataSheet, 'Metadata');

            // Generate and download the file
            const fileName = `calgary_buildings_metadata_${Date.now()}.xlsx`;
            XLSX.writeFile(workbook, fileName);

            showStatus(`✓ Excel file exported successfully (${currentBuildings.length} buildings)`, 'success');
            setTimeout(hideStatus, 3000);
        }
// ---------------------------------------------------------- EXPORTERS --------------------------------------------------------------------------------------------------------------------





        // Event listeners
        document.getElementById('loadApiTrees').addEventListener('click', fetchTreesInView);
        document.getElementById('loadDetailedBuildings').addEventListener('click', loadDetailedBuildings);
        document.getElementById('exportGeoJSON').addEventListener('click', exportGeoJSON);
        document.getElementById('exportOBJ').addEventListener('click', exportOBJ);
        document.getElementById('exportExcel').addEventListener('click', exportExcel);

        // Load initial buildings when map is ready
        map.on('load', () => {
            // Load chunks index for tile-based loading
            loadChunksIndex();
            showStatus('Map ready! Search or pan, then load buildings.', 'success');
            setTimeout(hideStatus, 4000);
        });
    </script>
